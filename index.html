<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archipelago Viewer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1>Archipelago Viewer</h1>
                <button id="themeToggle" class="theme-toggle" title="Toggle light/dark mode">
                    <span class="theme-icon">🌙</span>
                </button>
            </div>
        </header>

        <!-- Connection Panel -->
        <div class="connection-panel">
            <div class="connection-form">
                <div class="form-fields">
                    <div class="form-labels">
                        <div class="form-group">
                            <label for="hostInput">Host URL:Port</label>
                        </div>
                        <div class="form-group">
                            <label for="slotInput">Slot Name</label>
                        </div>
                        <div class="form-group">
                            <label for="passwordInput">Password (Optional)</label>
                        </div>
                        <div><!-- spacer for button column --></div>
                    </div>
                    <div class="form-controls">
                        <div class="form-group">
                            <input 
                                type="text" 
                                id="hostInput" 
                                placeholder="archipelago.gg:69420"
                                class="form-input"
                            >
                        </div>
                        <div class="form-group">
                            <input 
                                type="text" 
                                id="slotInput" 
                                placeholder="Player Name"
                                class="form-input"
                            >
                        </div>
                        <div class="form-group">
                            <input 
                                type="password" 
                                id="passwordInput" 
                                placeholder="Leave blank if not required"
                                class="form-input"
                            >
                        </div>
                        <div class="form-actions">
                            <button id="connectBtn" class="btn btn-primary">Connect</button>
                            <span id="connectionStatus" class="connection-status"></span>
                        </div>
                    </div>
                </div>
            </div>
            <div id="playersList" class="players-list"></div>
        </div>

        <!-- Main Content Area -->
        <div class="main-content" id="mainContent" style="display: none;">
            <!-- Chat Log Area -->
            <div class="chat-area">
                <!-- Chat Log -->
                <div id="chatLog" class="chat-log">
                    <div class="chat-placeholder">
                        Connect to a server to view chat log
                    </div>
                </div>

                <!-- Command Input -->
                <div class="command-input-area">
                    <input 
                        type="text" 
                        id="commandInput" 
                        placeholder="Enter server command..."
                        class="command-input"
                        disabled
                    >
                    <button id="sendCommandBtn" class="btn btn-primary" disabled>Send</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="src/bootstrap.js"></script>
</body>
</html>
